<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Fyers Options Desk — Real-time options chain analysis, market bias, key levels, and option buying focus">
    <title>{% block title %}Options Desk | Fyers Realtime Analysis{% endblock %}</title>

    <!-- Modern Typography (Inter & Fira Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/options_desk.css') }}?v=20261005_diag">
    {% block extra_css %}{% endblock %}
</head>

<body class="desk-body">
    <!-- Navbar / Top Header -->
    <header class="desk-header">
        <div class="desk-container header-inner">
            <div class="brand-group">
                <div class="brand-logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1 class="brand-title">OPTION DESK</h1>
                    <span class="brand-sub">REALTIME MARKET INTELLIGENCE</span>
                </div>
            </div>

            <!-- Controls: Underlying + Expiry -->
            <div class="header-controls">
                <div class="control-item">
                    <label for="symbol-select" class="control-label">UNDERLYING</label>
                    <select id="symbol-select" class="desk-select" aria-label="Select Underlying Index">
                        {% for item in indices %}
                        <option value="{{ item.symbol }}" {% if item.symbol==default_symbol %}selected{% endif %}>{{
                            item.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="control-item">
                    <label for="expiry-select" class="control-label">EXPIRY</label>
                    <select id="expiry-select" class="desk-select" aria-label="Select Expiry Date">
                        {% for exp in expiries %}
                        <option value="{{ exp }}">{{ exp }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Live Status & Auto-refresh Timer -->
                <div class="header-meta">
                    <div class="status-pill" id="live-status-pill" title="Market Data Status">
                        <span class="pulse-dot"></span>
                        <span id="live-status-text">LIVE</span>
                    </div>

                    <div class="timer-pill" id="refresh-timer-pill" title="Next auto-refresh in 3 minutes">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span id="countdown-timer">03:00</span>
                    </div>

                    <!-- Trade Analysis Header Button -->
                    <button type="button" class="btn-action btn-gold btn-sm" id="btn-top-trade-analysis" title="Open AI Trade Analysis & Auto-Trade Readiness">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span>Trade Analysis</span>
                    </button>

                    <!-- Manual Refresh Button -->
                    <button type="button" class="btn-icon" id="btn-manual-refresh" aria-label="Refresh Data Now"
                        title="Refresh Data Now">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="desk-main desk-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="desk-footer">
        <div class="desk-container footer-inner">
            <div class="footer-left">
                <span>Fyers Option Desk &bull; Auto-syncs every 3 mins &bull; Pure Analysis &bull; Non-Execution</span>
            </div>
            <div class="footer-right">
                <span class="disclaimer-note">Analytical Tool only &bull; Not financial advice</span>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/options_desk.js') }}?v=20261005_diag"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
